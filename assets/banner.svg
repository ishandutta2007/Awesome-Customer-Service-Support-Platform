<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glass Card Style -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }

    /* Ambient Dynamic Pulsing and Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-16px) translateX(8px); opacity: 0.8; }
    }
    @keyframes orbitFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    .glow-sphere-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glow-sphere-2 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 1000px 300px;
    }
    .float-item-1 { animation: floatParticle 5s ease-in-out infinite; }
    .float-item-2 { animation: floatParticle 7s ease-in-out 1s infinite; }
    .float-item-3 { animation: floatParticle 6s ease-in-out 2s infinite; }
    .stream-line {
      stroke-dasharray: 12 12;
      animation: orbitFlow 10s linear infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#subtleGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="220" cy="120" r="240" fill="url(#glowLeft)" class="glow-sphere-1" />
  <circle cx="980" cy="300" r="260" fill="url(#glowRight)" class="glow-sphere-2" />

  <!-- Animated Ambient Data Flow Streams (Background Behind Foreground Text) -->
  <g opacity="0.45">
    <path d="M 50 80 Q 300 20 600 80 T 1150 60" fill="none" stroke="url(#primaryGrad)" stroke-width="2" class="stream-line" />
    <path d="M 80 360 Q 400 390 750 340 T 1120 370" fill="none" stroke="url(#accentGrad)" stroke-width="1.75" class="stream-line" style="animation-direction: reverse;" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="140" cy="90" r="4" fill="#38bdf8" class="float-item-1" />
  <circle cx="280" cy="40" r="3" fill="#818cf8" class="float-item-2" />
  <circle cx="1060" cy="110" r="4.5" fill="#c084fc" class="float-item-3" />
  <circle cx="920" cy="70" r="3" fill="#38bdf8" class="float-item-1" />
  <circle cx="1110" cy="340" r="3.5" fill="#f43f5e" class="float-item-2" />
  <circle cx="180" cy="330" r="3" fill="#06b6d4" class="float-item-3" />

  <!-- Top Decorative Category Tag -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="-150" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="10" y="5" text-anchor="middle" class="tagline-text">CURATED ECOSYSTEM &amp; BENCHMARKS</text>
  </g>

  <!-- High-Contrast Foreground Title -->
  <!-- Subtle dark drop shield ensuring crisp contrast -->
  <text x="600" y="152" text-anchor="middle" class="title-text" fill="#000000" opacity="0.65" filter="blur(3px)">Customer Service &amp; Support Platforms</text>
  <text x="600" y="150" text-anchor="middle" class="title-text">
    Customer Service &amp; Support Platforms
  </text>

  <!-- High-Contrast Foreground Subtitle -->
  <text x="600" y="196" text-anchor="middle" class="subtitle-text">
    Top Open-Source Helpdesks, Omnichannel SaaS Suites &amp; AI Ticketing Infrastructure
  </text>

  <!-- Feature Pills / Badges in Grid Below Text -->
  <g transform="translate(600, 270)">
    <!-- Pill 1: Shared Inboxes -->
    <g transform="translate(-430, 0)">
      <rect x="0" y="0" width="195" height="48" rx="24" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="24" r="10" fill="#6366f1" fill-opacity="0.25" />
      <text x="28" y="28" text-anchor="middle" fill="#818cf8" font-size="12">📥</text>
      <text x="110" y="29" text-anchor="middle" class="pill-label">Shared Inboxes</text>
    </g>

    <!-- Pill 2: AI Resolution Agents -->
    <g transform="translate(-215, 0)">
      <rect x="0" y="0" width="205" height="48" rx="24" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="24" r="10" fill="#3b82f6" fill-opacity="0.25" />
      <text x="28" y="28" text-anchor="middle" fill="#60a5fa" font-size="12">🤖</text>
      <text x="114" y="29" text-anchor="middle" class="pill-label">AI Agent Deflection</text>
    </g>

    <!-- Pill 3: Self-Hosted & Open Source -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="205" height="48" rx="24" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="24" r="10" fill="#06b6d4" fill-opacity="0.25" />
      <text x="28" y="28" text-anchor="middle" fill="#22d3ee" font-size="12">🔓</text>
      <text x="116" y="29" text-anchor="middle" class="pill-label">Self-Hosted / OSS</text>
    </g>

    <!-- Pill 4: SLA & ITSM Routing -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="195" height="48" rx="24" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6" />
      <circle cx="28" cy="24" r="10" fill="#c084fc" fill-opacity="0.25" />
      <text x="28" y="28" text-anchor="middle" fill="#e879f9" font-size="12">⚡</text>
      <text x="110" y="29" text-anchor="middle" class="pill-label">SLAs &amp; Ticketing</text>
    </g>
  </g>

  <!-- Sub-footer Stats Bar -->
  <g transform="translate(600, 362)">
    <text x="0" y="0" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="500">
      ⚡ Ranked by GitHub Stars &amp; Scale • Omnichannel Ticketing • Transparent Pricing &amp; Limits
    </text>
  </g>
</svg>
